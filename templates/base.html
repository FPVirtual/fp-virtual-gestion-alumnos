<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}FP virtual Aragón{% endblock %}</title>
<style>
  /* Estilos globales de todos los correos. Los clientes de correo ignoran muchas reglas: lo esencial va también en línea. */
  body { margin: 0; padding: 0; background: #f2f4f7; }
  a { color: #2975c1; }
  p { margin: 0 0 16px 0; }
  pre { background: #f2f4f7; padding: 12px; overflow-x: auto; font-size: 12px; }
</style>
</head>
<body style="margin:0;padding:0;background:#f2f4f7;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f4f7;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#ffffff;border-radius:8px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#222222;">
        <tr>
          <td style="background:#ffffff;padding:20px 32px;border-bottom:4px solid #2975c1;">
            {% if logo %}<img src="cid:logo" alt="FP virtual Aragón" width="130" style="display:block;border:0;width:130px;height:auto;">{% else %}<span style="color:#2975c1;font-size:20px;font-weight:bold;">FP virtual Aragón</span>{% endif %}
          </td>
        </tr>
        <tr>
          <td style="padding:32px;">
            {% block contenido %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px;background:#f8f9fb;border-top:1px solid #e3e6ea;font-size:13px;color:#555555;">
            {% block pie %}
            <p>Saludos,</p>
            <p><strong>FP virtual Aragón</strong></p>
            <p style="margin:0;">
              <a href="https://www.instagram.com/campusdigitalfp/" target="_blank"><img src="https://campusdigitalfp.com/wp-content/uploads/2023/11/logo-ig.png" alt="Instagram" width="32" height="32" style="border:0;"></a>
              <a href="https://www.linkedin.com/company/campusdigitalfp/" target="_blank"><img src="https://campusdigitalfp.com/wp-content/uploads/2023/11/logo-lk.png" alt="LinkedIn" width="32" height="32" style="border:0;"></a>
              <a href="https://twitter.com/CampusDigitalFP" target="_blank"><img src="https://campusdigitalfp.com/wp-content/uploads/2023/11/logo-x.png" alt="X" width="32" height="32" style="border:0;"></a>
              <a href="https://www.youtube.com/@CampusDigitalFP" target="_blank"><img src="https://campusdigitalfp.com/wp-content/uploads/2024/06/logo-yt.png" alt="YouTube" width="32" height="32" style="border:0;"></a>
            </p>
            {% endblock %}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
